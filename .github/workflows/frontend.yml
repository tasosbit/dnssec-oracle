name: Frontend

# Pushes to main also deploy to Cloudflare Pages (dnssec-oracle-testnet.pages.dev).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push cancels the older run, so an older build can never deploy over a newer one.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the frontend imports the SDK's dist; its generated sources are committed, so no algokit
      - run: pnpm --dir projects/dnssec-oracle-sdk run build
      - run: pnpm --dir projects/frontend run build
      - run: pnpm --dir projects/frontend run test
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-dist
          path: projects/frontend/dist
          if-no-files-found: error

  # Only wrangler runs here: no checkout, install or build, so nothing from the
  # dependency tree ever sees the Cloudflare token.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: testnet
      url: https://dnssec-oracle-testnet.pages.dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-dist
          path: dist
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.147.0
          command: pages deploy dist --project-name=dnssec-oracle-testnet --branch=main --commit-hash=${{ github.sha }}
